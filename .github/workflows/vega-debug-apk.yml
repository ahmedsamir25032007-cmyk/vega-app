name: Vega Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hybrid-glass-provider

permissions:
  contents: read

concurrency:
  group: vega-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build required ARMv7 FFmpeg native libraries
        uses: ./.github/actions/ffmpeg-armv7

      - name: Generate Android native project
        env:
          APP_VARIANT: standalone
        run: npm run build:sandbox && npx expo prebuild --platform android --clean --no-install

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --no-parallel --console=plain --stacktrace
          cd ..
          mkdir -p build-output
          find android/app/build/outputs/apk/debug -name '*.apk' -exec cp {} build-output/ \;
          test -n "$(find build-output -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Liquid-Glass-debug
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 14
